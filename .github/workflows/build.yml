name: Build Ludo APKs
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash build.sh ludo_game "Ludo Game"
      - run: bash build.sh ludo_controller "Ludo Controller"
      - uses: actions/upload-artifact@v4
        with:
          name: ludo_game-apk
          path: build_ludo_game/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ludo_controller-apk
          path: build_ludo_controller/build/app/outputs/flutter-apk/app-release.apk
