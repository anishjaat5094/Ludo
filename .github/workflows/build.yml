name: Build Ludo APKs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: ludo_game
            label: Ludo Game
          - app: ludo_controller
            label: Ludo Controller
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project and build APK
        run: | flutter create --platforms=android --org com.funludo --project-name ${{ matrix.app }} build_${{ matrix.app }} cp ${{ matrix.app }}.dart build_${{ matrix.app }}/lib/main.dart cd build_${{ matrix.app }} rm -rf test sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n <application|' android/app/src/main/AndroidManifest.xml sed -i 's|android:label="[^"]*"|android:label="${{ matrix.label }}"|' android/app/src/main/AndroidManifest.xml flutter pub get flutter build apk --release 
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: build_${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
